name: CI

on:
  push:
    branches: [master, Nam]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore (khóa phiên bản)
        run: dotnet restore ObentoTensho.sln --locked-mode
      - name: Build
        run: dotnet build ObentoTensho.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ObentoTensho.sln --configuration Release --no-build
      - name: Gói NuGet có lỗ hổng
        run: |
          dotnet list ObentoTensho.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài gói
        run: npm ci
      - name: Build customer
        run: npx ng build customer
      - name: Build admin
        run: npx ng build admin
      - name: Test customer
        run: npx ng test customer --watch=false
      - name: Test admin
        run: npx ng test admin --watch=false
      - name: Gói npm có lỗ hổng mức High trở lên
        run: npm audit --audit-level=high

  secrets:
    name: Quét bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cài gitleaks 8.30.1 (kiểm tra checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep " gitleaks_8.30.1_linux_x64.tar.gz$" checksums.txt | sed 's/ gitleaks_8.30.1_linux_x64.tar.gz$/ gitleaks.tar.gz/' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Quét toàn bộ lịch sử
        run: ./gitleaks git --redact --no-banner --verbose
